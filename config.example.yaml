# 陪玩助手工具箱配置模板
# 复制为 config.yaml 后按需修改；未列出的项走代码内默认值。

paths:
  data_dir: data          # 数据根目录（相对项目根；服务端容器用 TOOLBOX_DATA_DIR
                           # 环境变量指到挂载点，优先级高于本项）

# ---- 可选功能开关（依赖缺失时 pipeline 自动降级跳过对应阶段）----
features:
  asr: true               # 语音线（asr/speaker/voice）。核心版（只装
                           # requirements.txt）保持 true 也会因缺依赖自动跳过；
                           # 装了 requirements-asr.txt 后想临时关语音线可置 false

# ---- 应用端 <-> 服务端（ECS）搬运，接口契约见 docs/SERVER-INTERFACE.md ----
server:
  # ===== 上传通道二选一（契约 1.3.0）=====
  # A. 客户机（推荐/分发包默认）：受控 HTTPS 上传——不需要 ssh 私钥和 rsync，
  #    tenant 由服务端从 token 解出（下面的 tenant/ssh_alias 均不参与）。
  #    两项都配好才生效；upload_url 非空而 upload_token 缺失会直接报错（不回退 SSH）。
  upload_url: https://95188.pw/api/production/v1
  upload_token: ""            # 可选。留空=账号模式（登录会话+DSJ-PC-1 签名，
                              # 服务端 INT-1 核验解租户，客户机零配置 token，
                              # 需先在桌宠登录）；填了则用 1.3.0 租户 token
  # B. 内部机：rsync over ssh——upload_url 留空即走此通道，需要 ~/.ssh 别名 + rsync。
  # tenant: my-tenant   # 租户名（字母数字-_，≤32 字，仅 rsync 通道）。不配置则首次
                        # push/pull 按装机时间自动生成 auto-YYYYMMDD-HHMMSS 并写回本文件
  ssh_alias: ecs            # ~/.ssh/config 里的别名（rsync 通道 push/pull 用）
  remote_root: /opt/dashijie-eval-data   # 服务端稳定数据根（部署包外，更新不删）
  container: dashijie-eval  # 服务端跑 toolbox 的容器（rsync 通道触发 import/eval 用）
  site_url: http://8.153.157.239/eval/
  keep_sessions: 3          # 服务端 prune 默认保留最近 N 个会话

# ---- 统一账号（契约 §4A，1.4.0 冻结；C2S-10~14）----
# 服务端能力未就绪时（health 未声明 pc_device_auth_contract=1.0），账号功能
# 显示"服务待就绪"，不降级不绕过。设备密钥自动生成（Ed25519+DPAPI，
# data/.device/），无需配置。
account:
  api_url: https://95188.pw/api/account/v1
  # production_url: ""      # C2S-13/14 生产查询基址；留空=由 api_url 推导
  # gate_pipeline: true     # 识别链路登录门控（REQ-20261019-013）：配了 api_url
                           # 即默认开启；内部机/开发可设 false 关闭

# ---- 录像目录后台日任务（REQ-20261019-013 起；扫描/生产分离 REQ-20261021-001 规则 2-4）----
folder_watch:
  # watch_dir: "D:/录像"    # 监控目录（场次子目录/散装视频均可）；留空=不启用
  scan_interval_min: 120   # 扫描节拍（分钟）：稳定录像入队待产（扫描≠生产）
  daily_hour: 4            # 生产时刻（0-23，北京时间口径）：触发当日生产判定；
                           # 开机时 24h 未生产则启动即补跑（条件不豁免）
  threshold_gb: 2          # 触发阈值：近 24h 新增录像总字节严格>该值（十进制
                           # GB）才生产；不足/无新录像不生产、当日权益照算
  production_window_s: 86400  # 滚动生产窗口（秒）：窗口内只触发一次（客户端
                           # 口径；服务端建组窗口 409 为最终权威）
  stable_min: 10           # 视频静置判稳分钟数（写入中不处理/不计新增）

# ---- B站直播录制（toolbox record）----
recorder:
  qn: 10000              # 画质档：10000=原画(1080P)；15000=2K 20000=4K 250=超清。
                         # 主播推流上限各不同，房间不支持时自动降最高可用档；
                         # 高画质需登录 cookie（复用 download.cookies_file，
                         # 缺失时自动用匿名指纹，部分房间画质受限）
  segment_min: 30        # 单文件时长（分钟），到点自动轮转分片（P 号延续）
  stall_sec: 20          # 录制中无数据超过该秒数判定断流，自动重拉直链续录
  poll_sec: 30           # watch 模式下播后轮询间隔（秒）

# ---- B站下载（toolbox download）----
download:
  cookies_file: bilibili_cookies.txt   # Netscape 格式 cookie（相对项目根）
  qn: 80                               # 80=1080P

# ---- 1. 视频生产 ----
highlight:
  method: keyword         # keyword = ASR+关键词正则命中
                           # llm     = 大模型选段（LLM 只挑句段编号+分数+理由，
                           #            时间戳一律由本地转写句边界对齐，不猜时间）
  preroll_sec: 0          # 片段起点前留白（落到句首）
  max_clip_sec: 180       # 单个高光片段最大时长（超长尾部丢整句）
  merge_gap_sec: 25       # 相邻命中句间隔小于该值合并为同一段
  keywords_strong: 击倒|击毙|击杀|淘汰|秒了|灭队|团灭|双杀|三杀|四杀|连杀|爆头|补掉
  keywords_weak: 我操|卧槽|牛逼|漂亮|666|天哪|绝了|冲冲冲
  # 关键词按主播口癖校准：冷静型主播（如陪玩）常见 折了|一队|杀|没了|好猛|稳的

remix:
  font_path: ""          # 成片字体；空=自动探测（macOS 系统 Linux Noto Sans CJK）
  template: fast_cut     # toolbox/templates/ 下的模板名（不带 .yaml）；
                         # 可用：fast_cut/hot_kills/loot_run/match_story/category_mix/single_best

knockdown:               # 击倒片段链路（python3 -m toolbox knockdowns）
  pre_sec: 6             # 击倒前留白
  post_sec: 10           # 击倒后延续
  merge_sec: 12          # 相邻击倒合并窗口（连杀不切碎）

pickup:                  # 拾取会话链路（python3 -m toolbox pickups / pscore）
  merge_sec: 25          # 粗簇窗口：仅用于圈定容器界面小扫描的范围
  look_back: 35          # 岛首事件前小扫描秒数（覆盖开箱-翻看-首拾）
  look_fwd: 15           # 岛末事件后小扫描秒数
  max_sec: 90            # 单会话片段封顶秒数（超长整理会话截断）
  scan_workers: 5        # 岛屿小扫描并行进程数（每进程限 2 线程；另有 GPU worker 混部）

# ---- 2. 发布与反馈 ----
# 2026-09-15 决策：不做自动发布（openapi 需企业资质；browser 自动化实证被
# 风控）——改为 remix 的 publish.json 发布包 + 创作者手动上传，详见 douyin.py
douyin:
  mode: openapi           # openapi = 官方开放平台（需企业资质）
                           # browser = 浏览器自动化（已实证被风控，弃用）
  credentials_file: douyin_credentials.yaml
  publish_schedule: ""    # 定时发布（如 "2026-09-10 18:00"），留空立即发布

# ---- 3. 数据报告 ----
stats:
  method: ocr             # ocr = 结算面板/播报 OCR；cv = 目标检测（未定）
  game: pubg              # 影响识别的 HUD 布局

# ---- 逐帧行为识别（python3 -m toolbox detect）----
detector: {}              # 空字典；裸写 `detector:`（子项全注释）会解析成 null
  # workers: 0            # detect 分段并行 CPU worker 数；0=自动（>=5min 分片
  #                       # 取 min(6, 核数/4)，短分片串行）。CLI --workers 优先
  # gpu_workers: 2        # CUDA worker 数（detect 走 ocr_gpu 批量引擎 ~6.7 帧/s/
  #                       # worker，pickups 走逐帧 CUDA 混部）；0=关。
  #                       # 需 onnxruntime-gpu + CUDA 版 torch
  # band_scale: 1.0       # 信息带降采样（0.8 单帧快 ~35% 但实测整体不提速、
  #                       # 丢 ~4 条边缘事件，仅召回不敏感场景使用）
  # ocr_use_cuda: false   # OCR 全走 GPU（默认关，单进程反而慢；提速请用
  #                       # workers/gpu_workers 混部并行，见 README 性能节）
  # loadout_enabled: true # 入局装备识别（干员/职业/主武器，围绕 match_start
  #                       # 补扫大厅+落地两窗，已并行化）
  # operator_class:       # 干员→职业映射（随赛季更新，可覆盖/扩充 OCR 别名）
  #   红狼: 突击
  # weapon_type:          # 枪械→类别映射（未收录的保留原名、类别留空）
  #   SCAR-H: 突击步枪
  # dance_keywords: [跳舞, 舞动, 热舞]   # 跳舞 HUD 提示词（待实测校准）
  # price_table:                        # 高价值物品估价（哈夫币，参考价可覆盖）
  #   曼德尔砖: 3500000
  #   红卡: 1200000

# ---- 大模型接入点（后续启用）----
llm:
  enabled: false
  # provider: zhipu
  # model: glm-4v
  # api_key_env: LLM_API_KEY
